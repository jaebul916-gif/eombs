<title>셀러포트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Apple Store tone. Full-bleed translucent nav, huge two-tone headlines, soft grey tiles with 28px corners, pill buttons, blue text links. */
:root{
  --bg:#ffffff; --tile:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --field:#ffffff;
  --accent:#0071e3; --accent-ink:#ffffff; --link:#0066cc; --accent-soft:#e8f1fc; --nav:rgba(255,255,255,.8);
  --ok:#248a3d; --ok-soft:#e3f4e8; --warn:#bf4800; --warn-soft:#fdeedd; --bad:#d70015; --bad-soft:#fde7ea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --tile:#1d1d1f; --ink:#f5f5f7; --muted:#86868b; --line:#424245; --field:#000000;
  --accent:#0071e3; --accent-ink:#ffffff; --link:#2997ff; --accent-soft:#0f2742; --nav:rgba(22,22,23,.8);
  --ok:#30d158; --ok-soft:#10301b; --warn:#ff9f0a; --warn-soft:#3a2508; --bad:#ff6961; --bad-soft:#3d1517; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --tile:#1d1d1f; --ink:#f5f5f7; --muted:#86868b; --line:#424245; --field:#000000;
  --accent:#0071e3; --accent-ink:#ffffff; --link:#2997ff; --accent-soft:#0f2742; --nav:rgba(22,22,23,.8);
  --ok:#30d158; --ok-soft:#10301b; --warn:#ff9f0a; --warn-soft:#3a2508; --bad:#ff6961; --bad-soft:#3d1517; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);letter-spacing:-.011em;padding-bottom:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:70rem;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.navband{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.navin{display:flex;align-items:center;gap:1.2rem;min-height:3rem;flex-wrap:wrap;padding-block:.15rem}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.brand:hover{text-decoration:none}
.links{display:flex;gap:1.5rem;flex:1;justify-content:center;overflow-x:auto;min-width:0;scrollbar-width:none}
.links a{color:var(--muted);font-size:.8rem;white-space:nowrap;padding-block:.5rem}
.links a:hover,.links a[aria-current="page"]{color:var(--ink);text-decoration:none}
.right{display:flex;gap:1rem;align-items:center;font-size:.8rem;white-space:nowrap}
.right a,.linkbtn{color:var(--ink);background:none;border:0;padding:0;font:inherit;cursor:pointer}
.right .who{color:var(--muted)}
.cartlink b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:1.15rem;height:1.15rem;display:inline-grid;place-items:center;font-size:.7rem;margin-left:.3rem;padding-inline:.25rem}
.banner{background:var(--tile);color:var(--ink);text-align:center;padding:.7rem 1rem;font-size:.85rem}

main{padding-block:2.5rem 4rem}
section+section{margin-top:5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:.6rem 1.3rem;border-radius:980px;font:500 .95rem var(--font);cursor:pointer;min-height:2.6rem;text-decoration:none}
.btn:hover{filter:brightness(1.08);text-decoration:none}
.btn.ghost{background:transparent;color:var(--link);border-color:var(--link)}
.btn.sm{padding:.3rem .9rem;min-height:2.1rem;font-size:.85rem}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.lnk::after{content:" ›"}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:.65rem .85rem;width:100%;min-width:0}
textarea{min-height:5.5rem;resize:vertical;font-family:var(--mono);font-size:.85rem}
label{display:grid;gap:.3rem;font-weight:500;font-size:.85rem}
.card{background:var(--tile);border-radius:18px;padding:1.4rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:.8rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:.6rem;margin-bottom:1.2rem}
.sechead h2{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:600;letter-spacing:-.025em}
.big{font-size:clamp(2.2rem,6.5vw,3.8rem);font-weight:600;letter-spacing:-.035em;line-height:1.08}
.big span{color:var(--muted)}
.ph{font-size:clamp(2rem,5.5vw,3.2rem);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-bottom:1.5rem}
.ph span{color:var(--muted)}
.chip{font-weight:600;font-size:.75rem;padding:.12rem .6rem;border-radius:99px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.accent{background:var(--accent-soft);color:var(--link)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.err{color:var(--bad);font-weight:500;margin-top:.6rem;font-size:.9rem}
.eyebrow{font-size:.75rem;font-weight:600;color:var(--warn);letter-spacing:.02em}
.eyebrow.q{color:var(--muted)}

.hero{text-align:center;display:grid;gap:1.1rem;justify-items:center;padding-block:2rem 0}
.hero .lead{color:var(--muted);font-size:clamp(1.05rem,2.4vw,1.3rem);max-width:36rem}
.hero .row{justify-content:center;margin-top:.4rem}
.showcase{background:var(--tile);border-radius:28px;padding:3rem 1.5rem 2.5rem;text-align:center;display:grid;gap:1.5rem;justify-items:center}
.showcase h2{font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:600;letter-spacing:-.03em}
.label{background:var(--bg);color:var(--ink);border-radius:14px;padding:1.1rem;font-family:var(--mono);max-width:20rem;width:100%;text-align:left;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.label-top{display:flex;justify-content:space-between;font-size:.7rem;letter-spacing:.1em;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:.5rem}
.label-route{font-size:2rem;font-weight:600;letter-spacing:.04em;padding-block:.5rem .1rem}
.barcode{height:3.2rem;margin-block:.6rem;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px,var(--ink) 12px 13px,transparent 13px 17px)}
.label dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;font-size:.78rem}
.label dt{color:var(--muted)}
.label dd{margin:0;text-align:right}
.label-foot{margin-top:.6rem;font-size:.68rem;color:var(--muted);text-align:center;letter-spacing:.06em}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:.8rem}
.tile{background:var(--tile);border-radius:28px;padding:2.2rem 1.4rem 1.8rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.45rem;min-height:21rem}
.tile h3{font-size:1.6rem;font-weight:600;letter-spacing:-.025em;margin-top:.1rem}
.tile .sub{color:var(--muted);font-size:.95rem;max-width:20rem}
.tile .from{font-size:1.05rem;font-weight:500;margin-top:.4rem}
.tile .from s{color:var(--muted);font-size:.85rem;margin-right:.4rem}
.tile .push{margin-top:auto;display:grid;gap:.6rem;justify-items:center;padding-top:1.2rem}
.calc{display:grid;gap:1rem;max-width:34rem;margin-inline:auto;text-align:left}
.calc .total{font-size:2.2rem;font-weight:600;letter-spacing:-.03em}
.calc2{display:grid;grid-template-columns:minmax(0,1fr) 7rem;gap:.8rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:2rem;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:600;font-size:.85rem;margin-bottom:.7rem}
.steps h3{font-size:1.1rem;margin-bottom:.3rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chips button{border:0;background:var(--tile);color:var(--ink);border-radius:980px;padding:.45rem 1.1rem;font:500 .88rem var(--font);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{margin-bottom:1.4rem}

.cartwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem;align-items:start}
.line{display:grid;gap:.7rem}
.line+.line{margin-top:.8rem}
.line-head{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:center}
.qty{display:inline-flex;align-items:center;background:var(--bg);border-radius:980px;overflow:hidden}
.qty button{border:0;background:none;color:var(--ink);width:2.3rem;height:2.3rem;font-size:1.1rem;cursor:pointer}
.qty span{min-width:2rem;text-align:center;font-weight:500}
.sum{display:grid;gap:.5rem}
.sum .t{display:flex;justify-content:space-between}
.sum .t.tot{font-size:1.25rem;font-weight:600;border-top:1px solid var(--line);padding-top:.7rem}
.form{display:grid;gap:.85rem;margin-top:1rem}
.radios{display:flex;gap:.5rem;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:.4rem;font-weight:500;background:var(--bg);padding:.5rem .9rem;border-radius:980px}
.radios input,.check input{width:auto}
.check{display:flex;align-items:center;gap:.5rem;font-weight:400}
.ord{display:grid;gap:.7rem}
.ord+.ord{margin-top:.8rem}
.ord-head{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}
.ord pre{margin:.3rem 0 0;white-space:pre-wrap;word-break:break-all;font:400 .8rem/1.5 var(--mono);background:var(--bg);border-radius:10px;padding:.55rem .7rem}
.ord ul{margin:0;padding-left:1.1rem}
.balance{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.balance strong{font-size:2.2rem;font-weight:600;letter-spacing:-.03em}
details>summary{cursor:pointer;font-weight:600}
details .body{margin-top:.6rem;white-space:pre-wrap;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:.7rem}
.empty{text-align:center;padding-block:4rem;display:grid;gap:1rem;justify-items:center}
.authbox{max-width:26rem;margin-inline:auto;display:grid;gap:1rem}
.demo{background:var(--accent-soft);border-radius:18px;padding:1.1rem;font-size:.85rem;display:grid;gap:.5rem}
.demo .row{justify-content:space-between}
.foot{background:var(--tile);color:var(--muted);font-size:.75rem;padding-block:1.6rem 2rem;margin-top:0}
.foot .wrap{display:grid;gap:.35rem}
.foot hr{border:0;border-top:1px solid var(--line);width:100%;margin:.6rem 0 .2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:980px;z-index:20;max-width:calc(100% - 2rem);font-weight:500;font-size:.9rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem;margin-bottom:1rem}
.dash>div{background:var(--tile);border-radius:18px;padding:1rem}
.dash b{display:block;font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.reply{background:var(--bg);border-radius:12px;padding:.8rem 1rem}
@media (max-width:760px){
  .cartwrap{grid-template-columns:minmax(0,1fr)}
  .links{order:3;flex-basis:100%;justify-content:flex-start;gap:1.2rem}
  .navin{gap:.8rem}
  .right{margin-left:auto}
  section+section{margin-top:3.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="navband"><div class="navin gut wrap">
  <a class="brand" href="#home">셀러포트</a>
  <nav class="links" aria-label="주요 메뉴">
    <a href="#home" data-r="home">홈</a>
    <a href="#services" data-r="services">서비스</a>

    <a href="#mypage" data-r="mypage">마이페이지</a>
    <a href="#manage" data-r="manage" id="adminLink" hidden>관리자</a>
  </nav>
  <div class="right"><span id="acctSlot"></span><a class="cartlink" href="#cart" aria-label="장바구니">장바구니<b id="cartCount">0</b></a></div>
</div></div>
<div id="bannerSlot"></div>
<div class="gut"><main class="wrap" id="app"></main></div>
<footer class="foot"><div class="gut"><div class="wrap" id="foot"></div></div></footer>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function won(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function dt(iso){try{return new Date(iso).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
var TYPES={register:'배송등록',domestic:'국내택배',storage:'보관',credit:'적립금',goods:'물품'};
var CATS={all:'전체',shopee:'쇼피',qoo10:'큐텐',etc:'기타'};
var STATUS={pending:['입금대기','warn'],paid:['결제완료','accent'],working:['처리중','accent'],done:['완료','ok'],canceled:['취소','bad']};
var DEFAULTS=[
 {id:'s-shopee',cat:'shopee',type:'register',name:'쇼피 배송등록',desc:'쇼피 주문번호를 입력하면 한 건씩 배송을 접수합니다.',price:2000,sale:1900,unit:'건',best:true,soldout:false,order:1},
 {id:'s-shopee-bundle',cat:'shopee',type:'register',name:'쇼피 합배송등록',desc:'같은 구매자의 여러 주문을 한 상자로 묶어 접수합니다.',price:2500,sale:2200,unit:'건',best:false,soldout:false,order:2},
 {id:'s-qoo10',cat:'qoo10',type:'register',name:'큐텐(KSE) 배송등록',desc:'큐텐 주문번호를 입력해 한 건씩 배송을 접수합니다.',price:2000,sale:1900,unit:'건',best:true,soldout:false,order:3},
 {id:'s-qoo10-bundle',cat:'qoo10',type:'register',name:'큐텐(KSE) 합배송등록',desc:'같은 구매자의 큐텐 주문을 한 상자로 묶어 접수합니다.',price:2500,sale:2200,unit:'건',best:false,soldout:false,order:4},
 {id:'s-domestic',cat:'etc',type:'domestic',name:'국내 택배 서비스',desc:'국내 구간 택배 발송을 대행합니다. 보내는 곳과 받는 곳을 남겨 주세요.',price:3000,sale:0,unit:'건',best:false,soldout:false,order:5},
 {id:'s-storage',cat:'etc',type:'storage',name:'물품 보관 서비스',desc:'입고된 물품을 보관합니다. 품목과 기간을 요청 메모에 적어 주세요.',price:30000,sale:20000,unit:'건',best:false,soldout:false,order:6},
 {id:'s-credit',cat:'etc',type:'credit',name:'적립금 충전',desc:'적립금을 충전해 다음 주문부터 결제에 사용합니다.',price:10000,sale:0,credit:10000,unit:'회',best:true,soldout:false,order:7},
 {id:'s-label',cat:'shopee',type:'goods',name:'쇼피 송장 라벨지 100×100 (500매)',desc:'바코드 프린터용 감열 라벨지입니다. 배송지가 필요합니다.',price:10000,sale:7500,unit:'개',best:false,soldout:false,order:8}
];
var ST={db:null,write:null,acct:null,admin:false,products:null,notices:null,settings:{},
  myDoc:null,myFulfil:null,myWallet:null,allOrders:null,allFulfil:{},allWallet:{},accounts:null,
  cart:[],form:{pay:'bank',name:'',phone:'',dep:'',addr:'',agree:false},route:'home',err:'',cat:'all',sort:'pop',
  calc:{pid:'',qty:1},atab:'orders',afilter:'all',busy:false,pending:false,ltab:'in',lerr:'',ready:false,next:'',pendingAdd:null,loginMsg:'',inq:null,replies:{},adminInq:null,ofilter:'all'};
var subs=[];
try{var c=JSON.parse(localStorage.getItem('sp-cart')||'[]');if(Array.isArray(c))ST.cart=c.filter(function(x){return x&&x.pid})}catch(e){}
function saveCart(){try{localStorage.setItem('sp-cart',JSON.stringify(ST.cart))}catch(e){}}

function products(){var p=(ST.products&&ST.products.length)?ST.products:DEFAULTS;return p.slice().sort(function(a,b){return (a.order||0)-(b.order||0)})}
function activeProducts(){return products().filter(function(p){return !p.hidden})}
function byId(id){return products().find(function(p){return p.id===id})}
function unit(p){return (p.sale>0&&p.sale<p.price)?p.sale:p.price}
function cartLines(){return ST.cart.map(function(c){var p=byId(c.pid);return p?{p:p,qty:c.qty,note:c.note||'',unit:unit(p)}:null}).filter(Boolean)}
function noteCount(n){return String(n||'').split('\n').map(function(s){return s.trim()}).filter(Boolean).length}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},3200)}
function myOrders(){var l=(ST.myDoc&&ST.myDoc.list)||[];var f=(ST.myFulfil&&ST.myFulfil.orders)||{};
  return l.map(function(o){var x=f[o.id]||{};return Object.assign({},o,{status:x.status||'pending',memo:x.memo||''})}).sort(function(a,b){return a.createdAt<b.createdAt?1:-1})}
function chip(s){var x=STATUS[s]||STATUS.pending;return '<span class="chip '+x[1]+'">'+x[0]+'</span>'}
async function hashPw(id,pw){var b=new TextEncoder().encode(id+':'+pw);var h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
var ID_RE=/^[a-z0-9_-]{4,20}$/;

/* ---------- pages ---------- */
function tile(p){var u=unit(p);
  return '<article class="tile" data-hay="'+esc((p.name+' '+p.desc).toLowerCase())+'">'+(p.best?'<div class="eyebrow">BEST</div>':'<div class="eyebrow q">'+esc(TYPES[p.type]||'')+'</div>')
   +(p.soldout?'<div class="eyebrow" style="color:var(--bad)">품절</div>':'')
   +'<h3>'+esc(p.name)+'</h3><p class="sub">'+esc(p.desc)+'</p>'
   +'<p class="from num">'+(u<p.price?'<s>'+won(p.price)+'</s>':'')+won(u)+' <span class="muted small">/ '+esc(p.unit||'건')+'</span></p>'
   +'<div class="push"><button class="btn" data-act="add" data-id="'+esc(p.id)+'"'+(p.soldout?' disabled':'')+'>담기</button></div></article>'}
function pageHome(){
  var ps=activeProducts();var reg=ps.filter(function(p){return p.type==='register'});
  var low=reg.length?Math.min.apply(null,reg.map(unit)):0;
  if(!ST.calc.pid&&ps.length)ST.calc.pid=(reg[0]||ps[0]).id;

/* ---------- render ---------- */
function render(){
  var r=ST.route;var h;
  if(!ST.ready&&(r==='cart'||r==='mypage'||r==='manage'))h='<section class="empty"><p class="muted">불러오는 중...</p></section>';
  else if(r==='services')h=pageServices();else if(r==='cart')h=pageCart();else if(r==='mypage')h=pageMy();else if(r==='notices')h=pageNotices();else if(r==='manage')h=pageAdmin();else if(r==='login')h=pageLogin();else if(r==='terms'||r==='privacy'||r==='refund')h=pageLegal(r);else h=pageHome();
  app.innerHTML=h;
  document.querySelectorAll('.links a').forEach(function(a){if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  var al=document.getElementById('adminLink');al.hidden=!ST.admin;var pc=ST.admin?allOrdersFlat().filter(function(o){return o.status==='pending'}).length:0;al.textContent=pc?'관리자 ('+pc+')':'관리자';
  document.getElementById('cartCount').textContent=ST.cart.reduce(function(s,c){return s+c.qty},0);
  document.getElementById('acctSlot').innerHTML=ST.acct?'<a href="#mypage" class="who">'+esc(ST.acct.name)+'님</a> <button class="linkbtn" data-act="logout">로그아웃</button>':'<a href="#login">로그인</a>';
  var s=ST.settings||{};
  document.getElementById('bannerSlot').innerHTML=s.banner?'<div class="banner">'+esc(s.banner)+'</div>':'';
  var biz=[];if(s.bizName)biz.push('상호 '+s.bizName);if(s.ceo)biz.push('대표 '+s.ceo);if(s.bizNo)biz.push('사업자등록번호 '+s.bizNo);if(s.mailOrder)biz.push('통신판매업 '+s.mailOrder);
  var biz2=[];if(s.bizAddr)biz2.push(s.bizAddr);if(s.tel)biz2.push(s.tel);if(s.hours)biz2.push(s.hours);
  document.getElementById('foot').innerHTML='<span>쇼피·큐텐 셀러를 위한 배송대행 서비스입니다.</span><span><a href="#terms">이용약관</a> · <a href="#privacy">개인정보 처리방침</a> · <a href="#refund">환불 규정</a></span>'+(biz.length||biz2.length?'<hr>':'')+(biz.length?'<span>'+esc(biz.join(' · '))+'</span>':'')+(biz2.length?'<span>'+esc(biz2.join(' · '))+'</span>':'')+'<hr><span>Copyright © 2026 셀러포트. All rights reserved.</span>';
}
function refresh(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a)){ST.pending=true;return}render()}
app.addEventListener('focusout',function(){if(!ST.pending)return;setTimeout(function(){var a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&app.contains(a))){ST.pending=false;render()}},0)});
function route(){var h=(location.hash||'').replace('#','');if(['home','services','cart','mypage','notices','manage','login','terms','privacy','refund'].indexOf(h)<0)h='home';
  if(ST.ready&&!ST.acct&&(h==='cart'||h==='mypage'||h==='manage')){ST.next='#'+h;ST.loginMsg='로그인 후 이용할 수 있습니다.';ST.ltab='in';location.hash='#login';return}
  ST.route=h;ST.err='';ST.lerr='';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- accounts ---------- */
function snapList(s){return s.docs.map(function(d){return Object.assign({_id:d.id},d.data())})}
function byAtDesc(a,b){return (a.at||'')<(b.at||'')?1:-1}
function startSubs(){
  subs.forEach(function(u){try{u()}catch(e){}});subs=[];
  ST.myDoc=null;ST.myFulfil=null;ST.myWallet=null;ST.allOrders=null;ST.allFulfil={};ST.allWallet={};ST.accounts=null;ST.inq=null;ST.replies={};ST.adminInq=null;
  var db=ST.db;if(!db||!ST.acct){render();return}
  var id=ST.acct.id;var er=function(){};
  subs.push(db.doc('orders/'+id).onSnapshot(function(s){ST.myDoc=s.exists?s.data():{list:[]};refresh()},er));
  subs.push(db.doc('fulfil/'+id).onSnapshot(function(s){ST.myFulfil=s.exists?s.data():{};refresh()},er));
  subs.push(db.doc('wallet/'+id).onSnapshot(function(s){ST.myWallet=s.exists?s.data():{balance:0};refresh()},er));
  subs.push(db.collection('inquiries').where('uid','==',id).onSnapshot(function(s){ST.inq=snapList(s).sort(byAtDesc);refresh()},er));
  subs.push(db.collection('replies').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});ST.replies=m;refresh()},er));
  if(ST.admin){
    subs.push(db.collection('orders').onSnapshot(function(s){ST.allOrders=snapList(s);refresh()},er));
    subs.push(db.collection('fulfil').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});ST.allFulfil=m;refresh()},er));
    subs.push(db.collection('wallet').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});ST.allWallet=m;refresh()},er));
    subs.push(db.collection('accounts').onSnapshot(function(s){ST.accounts=snapList(s);refresh()},er));
    subs.push(db.collection('inquiries').onSnapshot(function(s){ST.adminInq=snapList(s);refresh()},er));
  }
  render();
}
function setAcct(id,d){
  if(d){ST.acct={id:id,name:d.name||id,phone:d.phone||'',role:d.role||'buyer'};ST.admin=ST.acct.role==='admin';
    if(!ST.form.name)ST.form.name=ST.acct.name;if(!ST.form.phone)ST.form.phone=ST.acct.phone;
    try{localStorage.setItem('sp-sess',id)}catch(e){}}
  else{ST.acct=null;ST.admin=false;try{localStorage.removeItem('sp-sess')}catch(e){}}
  startSubs();
}
function needLogin(act){
  if(ST.acct)return false;
  ST.pendingAdd=act||null;ST.next=location.hash||'#home';ST.loginMsg='로그인 후 이용할 수 있습니다.';ST.ltab='in';
  location.hash='#login';if(ST.route==='login')render();
  return true;
}
function afterAuth(){
  var pa=ST.pendingAdd;ST.pendingAdd=null;if(pa)addToCart(pa.id,pa.qty);
  var nx=ST.next||'';ST.next='';ST.loginMsg='';
  var to=(nx&&nx!=='#login')?nx:(ST.admin?'#manage':'#mypage');
  if(location.hash===to)route();else location.hash=to;
}
async function doLogin(){
  var id=document.getElementById('lgId').value.trim().toLowerCase(),pw=document.getElementById('lgPw').value;
  ST.lerr='';
  if(!ST.db){ST.lerr='저장소에 연결되지 않았습니다.';return render()}
  if(!id||!pw){ST.lerr='아이디와 비밀번호를 입력해 주세요.';return render()}
  ST.busy=true;render();
  try{var s=await ST.db.doc('accounts/'+id).get();var ok=s.exists&&s.data().pw===await hashPw(id,pw);
    ST.busy=false;
    if(!ok){ST.lerr='아이디 또는 비밀번호가 맞지 않습니다.';return render()}
    setAcct(id,s.data());toast(ST.acct.name+'님, 환영합니다');afterAuth();
  }catch(e){ST.busy=false;ST.lerr='로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.';render()}
}
async function doSignup(){
  var g=function(i){return document.getElementById(i).value.trim()};
  var id=g('suId').toLowerCase(),name=g('suName'),phone=g('suPhone'),pw=document.getElementById('suPw').value,pw2=document.getElementById('suPw2').value;
  ST.lerr='';
  if(!ST.db){ST.lerr='저장소에 연결되지 않았습니다.';return render()}
  if(!ID_RE.test(id)){ST.lerr='아이디는 영문 소문자, 숫자, _, - 로 4~20자여야 합니다.';return render()}
  if(!name||!phone){ST.lerr='이름과 연락처를 입력해 주세요.';return render()}
  if(pw.length<6){ST.lerr='비밀번호는 6자 이상이어야 합니다.';return render()}
  if(pw!==pw2){ST.lerr='비밀번호 확인이 맞지 않습니다.';return render()}
  if(!document.getElementById('suAgree').checked){ST.lerr='이용약관과 개인정보 처리방침에 동의해 주세요.';return render()}
  ST.busy=true;render();
  try{var ex=await ST.db.doc('accounts/'+id).get();
    if(ex.exists){ST.busy=false;ST.lerr='이미 사용 중인 아이디입니다.';return render()}
    var rec={name:name,phone:phone,role:'buyer',pw:await hashPw(id,pw),createdAt:new Date().toISOString()};
    await ST.db.doc('accounts/'+id).set(rec);ST.busy=false;
    setAcct(id,rec);toast('가입이 완료되었습니다');afterAuth();
  }catch(e){ST.busy=false;ST.lerr='가입하지 못했습니다. 권한을 확인해 주세요.';render()}
}

/* ---------- cart & orders ---------- */
function addToCart(id,n){var p=byId(id);if(!p||p.soldout)return;var l=ST.cart.find(function(c){return c.pid===id});if(l)l.qty=Math.min(999,l.qty+n);else ST.cart.push({pid:id,qty:n,note:''});saveCart();document.getElementById('cartCount').textContent=ST.cart.reduce(function(s,c){return s+c.qty},0);toast('장바구니에 담았습니다')}
async function setDocMerge(path,patch){var ref=ST.db.doc(path);try{await ref.update(patch)}catch(e){if(e&&e.code==='invalid_argument')await ref.set(patch);else throw e}}
function ymd(){var d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
async function walletSet(uid,entries){
  var w=ST.allWallet[uid]||{};var bal=w.balance||0;var log=(w.log||[]).slice();var at=new Date().toISOString();
  entries.forEach(function(e){bal+=e.delta;log.unshift({at:at,delta:e.delta,reason:e.reason})});
  if(bal<0)throw new Error('neg');
  await ST.db.doc('wallet/'+uid).set({balance:bal,updatedAt:at,log:log.slice(0,50)});return bal;
}
async function placeOrder(){
  var lines=cartLines();var f=ST.form;ST.err='';
  if(!ST.db||!ST.acct){ST.err='로그인한 상태에서만 주문할 수 있습니다.';return render()}
  if(ST.write===false){ST.err='이 계정은 주문 권한이 없습니다. 공유 설정에서 Contributor 이상이 필요합니다.';return render()}
  if(!f.name.trim()||!f.phone.trim()){ST.err='이름과 연락처를 입력해 주세요.';return render()}
  var seen={};myOrders().filter(function(o){return o.status!=='canceled'}).forEach(function(o){o.items.forEach(function(i){(i.refs||[]).forEach(function(r){seen[r]=1})})});
  var items=[];
  for(var i=0;i<lines.length;i++){var l=lines[i],p=l.p;var it={pid:p.id,name:p.name,type:p.type,qty:l.qty,price:l.unit};
    if(p.type==='register'){var refs=String(l.note).split('\n').map(function(s){return s.trim()}).filter(Boolean);
      if(refs.length!==l.qty){ST.err=p.name+': 주문번호 '+refs.length+'개가 입력되었고 수량은 '+l.qty+'건입니다. 개수를 맞춰 주세요.';return render()}
      for(var k=0;k<refs.length;k++){if(seen[refs[k]]){ST.err='이미 접수했거나 중복 입력된 주문번호가 있습니다: '+refs[k];return render()}seen[refs[k]]=1}
      it.refs=refs}
    else if(p.type==='domestic'||p.type==='storage'){if(!String(l.note).trim()){ST.err=p.name+': 요청 내용을 입력해 주세요.';return render()}it.note=String(l.note).trim()}
    else if(l.note)it.note=String(l.note).trim();
    if(p.type==='credit')it.credit=p.credit>0?p.credit:p.price;
    items.push(it)}
  if(lines.some(function(l){return l.p.type==='goods'})&&!f.addr.trim()){ST.err='물품을 받을 배송지 주소를 입력해 주세요.';return render()}
  if(!f.agree){ST.err='확인 항목에 체크해 주세요.';return render()}
  var total=items.reduce(function(s,i){return s+i.price*i.qty},0);
  var now=new Date().toISOString();
  var order={id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:'SP'+ymd()+'-'+Math.floor(1000+Math.random()*9000),createdAt:now,pay:f.pay,depositor:f.pay==='bank'?(f.dep.trim()||f.name.trim()):'',
    contact:{name:f.name.trim(),phone:f.phone.trim(),addr:f.addr.trim()},items:items,total:total};
  ST.busy=true;render();
  try{
    var list=((ST.myDoc&&ST.myDoc.list)||[]).slice();list.unshift(order);
    await ST.db.doc('orders/'+ST.acct.id).set({uid:ST.acct.id,name:order.contact.name,phone:order.contact.phone,last:now,list:list});
    ST.cart=[];saveCart();ST.form.agree=false;ST.busy=false;
    toast('주문이 접수되었습니다');location.hash='#mypage';
  }catch(e){ST.busy=false;ST.err='주문을 저장하지 못했습니다. 권한을 확인하고 다시 시도해 주세요.';render()}
}
function csvCell(v){var s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act;var id=t.dataset.id;

  else if(a==='cat'){ST.cat=t.dataset.v;render()}

  else if(a==='logout'){ST.form={pay:'bank',name:'',phone:'',dep:'',addr:'',agree:false};ST.cart=[];saveCart();setAcct(null);toast('로그아웃했습니다');location.hash='#home'}
  else if(a==='me-save'){var nm=document.getElementById('meName').value.trim(),ph=document.getElementById('mePhone').value.trim();if(!nm||!ph){toast('이름과 연락처를 입력해 주세요');return}
    await ST.db.doc('accounts/'+ST.acct.id).update({name:nm,phone:ph});ST.acct.name=nm;ST.acct.phone=ph;toast('내 정보를 저장했습니다');render()}
  else if(a==='pw-save'){var po=document.getElementById('pwOld').value,pn=document.getElementById('pwNew').value,pn2=document.getElementById('pwNew2').value;

    var ps=await ST.db.doc('accounts/'+ST.acct.id).get();if(!ps.exists||ps.data().pw!==await hashPw(ST.acct.id,po)){toast('현재 비밀번호가 맞지 않습니다');return}
    await ST.db.doc('accounts/'+ST.acct.id).update({pw:await hashPw(ST.acct.id,pn)});['pwOld','pwNew','pwNew2'].forEach(function(k){document.getElementById(k).value=''});toast('비밀번호를 변경했습니다')}
  else if(a==='iq-add'){var it=document.getElementById('iqTitle').value.trim(),ib=document.getElementById('iqBody').value.trim();if(!it||!ib){toast('제목과 내용을 입력해 주세요');return}
    await ST.db.collection('inquiries').add({uid:ST.acct.id,name:ST.acct.name,title:it,body:ib,at:new Date().toISOString()});document.getElementById('iqTitle').value='';document.getElementById('iqBody').value='';toast('문의를 등록했습니다')}
  else if(a==='cancel-req'){var list=((ST.myDoc&&ST.myDoc.list)||[]).map(function(o){return o.id===id?Object.assign({},o,{cancelRequested:true}):o});
    await ST.db.doc('orders/'+ST.acct.id).set(Object.assign({},ST.myDoc,{list:list}));toast('취소를 요청했습니다')}
  else if(a==='atab'){ST.atab=t.dataset.v;render()}
  else if(a==='a-save'){var c=t.closest('[data-oid]');var po2={};po2[c.dataset.oid]={status:c.querySelector('[data-f=status]').value,memo:c.querySelector('[data-f=memo]').value};await setDocMerge('fulfil/'+c.dataset.uid,{orders:po2});toast('저장했습니다')}
  else if(a==='a-pay'){var c2=t.closest('[data-oid]');var uid=c2.dataset.uid;
    var o=allOrdersFlat().find(function(x){return x.id===c2.dataset.oid&&x.uid===uid});if(!o)return;
    var bal=(ST.allWallet[uid]||{}).balance||0;var en=[];
    if(o.pay==='points'){if(bal<o.total){toast('적립금 잔액이 부족합니다');return}en.push({delta:-o.total,reason:'주문 '+o.no+' 결제'})}
    o.items.forEach(function(i){if(i.type==='credit')en.push({delta:(i.credit||i.price)*i.qty,reason:'적립금 충전 '+o.no})});
    if(en.length)await walletSet(uid,en);
    var pp={};pp[o.id]={status:'paid',paidAt:new Date().toISOString(),memo:o.memo||''};await setDocMerge('fulfil/'+uid,{orders:pp});toast('결제를 확인했습니다')}
  else if(a==='a-refund'){var c8=t.closest('[data-oid]');var uid8=c8.dataset.uid;
    var o8=allOrdersFlat().find(function(x){return x.id===c8.dataset.oid&&x.uid===uid8});if(!o8)return;
    await walletSet(uid8,[{delta:o8.total,reason:'주문 '+o8.no+' 취소 환불'}]);
    var rp={};rp[o8.id]={status:'canceled',memo:((o8.memo||'')+' 적립금 환불').trim()};await setDocMerge('fulfil/'+uid8,{orders:rp});toast('적립금으로 환불했습니다')}
  else if(a==='a-csv'){

    allOrdersFlat().forEach(function(x){rows.push([x.no,x.createdAt,x.uid,x.contact&&x.contact.name,x.contact&&x.contact.phone,(STATUS[x.status]||[x.status])[0],x.pay==='points'?'적립금':'무통장입금',x.total,x.items.map(function(i){return i.name+'×'+i.qty}).join(' / '),x.items.map(function(i){return (i.refs||[]).join(' ')}).join(' '),x.memo])});
    var dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){toast('이 화면에서는 파일 저장을 쓸 수 없습니다');return}
    await dl.save({filename:'orders-'+ymd()+'.csv',data:'﻿'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')});toast('파일을 저장했습니다')}
  else if(a==='w-add'||a==='w-sub'){var c3=t.closest('[data-uid]');var amt=parseInt(c3.querySelector('[data-f=amt]').value,10);if(!amt||amt<1){toast('금액을 입력해 주세요');return}

    await ST.db.doc('accounts/'+c6.dataset.uid).update({pw:await hashPw(c6.dataset.uid,np)});c6.querySelector('[data-f=npw]').value='';toast('비밀번호를 변경했습니다')}
  else if(a==='ac-del'){var c7=t.closest('[data-uid]');await ST.db.doc('accounts/'+c7.dataset.uid).delete();toast('계정을 삭제했습니다')}
  else if(a==='ac-new'){var q=function(k){return document.querySelector('#acForm [data-k='+k+']')};var nid=q('id').value.trim().toLowerCase();
    if(!ID_RE.test(nid)){toast('아이디 형식이 맞지 않습니다');return}if(q('pw').value.length<6){toast('비밀번호는 6자 이상이어야 합니다');return}
    var ex=await ST.db.doc('accounts/'+nid).get();if(ex.exists){toast('이미 사용 중인 아이디입니다');return}
    await ST.db.doc('accounts/'+nid).set({name:q('name').value.trim()||nid,phone:q('phone').value.trim(),role:q('role').value,pw:await hashPw(nid,q('pw').value),createdAt:new Date().toISOString()});
    ['id','name','phone','pw'].forEach(function(k){q(k).value=''});toast('계정을 만들었습니다')}
  else if(a==='p-save'){var c4=t.closest('[data-pid]');var g=function(k){return c4.querySelector('[data-f='+k+']')};
    await ST.db.doc('products/'+c4.dataset.pid).set({name:g('name').value.trim(),cat:g('cat').value,type:g('type').value,price:+g('price').value||0,sale:+g('sale').value||0,credit:+g('credit').value||0,unit:g('unit').value.trim()||'건',order:+g('order').value||0,desc:g('desc').value.trim(),best:g('best').checked,soldout:g('soldout').checked,hidden:g('hidden').checked});toast('저장했습니다')}
  else if(a==='p-del'){var c5=t.closest('[data-pid]');await ST.db.doc('products/'+c5.dataset.pid).delete();toast('삭제했습니다')}
  else if(a==='p-new'){var nid2='p'+Date.now().toString(36);await ST.db.doc('products/'+nid2).set({name:'새 서비스',cat:'etc',type:'goods',price:1000,sale:0,credit:0,unit:'건',order:99,desc:'',best:false,soldout:false,hidden:true});toast('숨김 상태로 추가했습니다')}
  else if(a==='p-seed'){for(var i=0;i<DEFAULTS.length;i++){var d=Object.assign({},DEFAULTS[i]);var did=d.id;delete d.id;await ST.db.doc('products/'+did).set(d)}toast('기본 상품을 등록했습니다')}

  else if(a==='n-del'){await ST.db.doc('notices/'+id).delete();toast('삭제했습니다')}

    await ST.db.doc('replies/'+c9.dataset.qid).set({text:rt,at:new Date().toISOString()});toast('답변을 등록했습니다')}

});
app.addEventListener('input',function(e){var t=e.target;

app.addEventListener('change',function(e){var t=e.target;

app.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var t=e.target;if(t.id==='lgId'||t.id==='lgPw'){if(!ST.busy)doLogin()}});

/* ---------- data ---------- */
async function boot(){
  route();
  var cl=window.claude;
  if(!cl||!cl.use){ST.ready=true;route();return}
  try{var u=await cl.use('user');if(u)ST.write=await u.can('data.write')}catch(e){}
  try{ST.db=await cl.use('db')}catch(e){}
  var db=ST.db;
  if(!db){ST.ready=true;route();return}
  var er=function(){};
  db.collection('products').onSnapshot(function(s){ST.products=snapList(s).map(function(x){x.id=x._id;return x});refresh()},er);
  db.collection('notices').onSnapshot(function(s){ST.notices=snapList(s).sort(byAtDesc).map(function(x){x.id=x._id;return x});refresh()},er);
  db.doc('settings/site').onSnapshot(function(s){ST.settings=s.exists?s.data():{};refresh()},er);
  var sid=null;try{sid=localStorage.getItem('sp-sess')}catch(e){}
  if(sid){try{var a=await db.doc('accounts/'+sid).get();if(a.exists)setAcct(sid,a.data());else setAcct(null)}catch(e){}}
  ST.ready=true;route();
}
boot();
})();
